# Aperçu optionnel du site sur GitHub Pages (le site de production est hébergé chez OVH).
# Ne se lance qu’à la main : onglet Actions › « Aperçu sur GitHub Pages » › Run workflow.
# Prérequis : Settings › Pages › Build and deployment › Source = « GitHub Actions ».
name: Aperçu sur GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Préparer le dossier publié (fichiers du site uniquement)
        run: |
          mkdir _site
          cp -R index.html mentions-legales.html confidentialite.html 404.html robots.txt sitemap.xml .nojekyll assets _site/

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Téléverser le site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Déployer
        id: deployment
        uses: actions/deploy-pages@v4
